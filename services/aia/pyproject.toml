[project]
name = "cleartrace-aia"
version = "0.1.0"
description = "ClearTrace AIA scorer with official parity harness"
requires-python = ">=3.12"
license = { text = "LicenseRef-ClearTrace-Evaluation-Only" }
dependencies = [
  "cleartrace-contracts",
  "pyyaml>=6.0",
]

[tool.uv.sources]
cleartrace-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartrace_aia"]
