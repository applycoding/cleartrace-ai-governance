[project]
name = "cleartrace-core-api"
version = "0.1.0"
description = "ClearTrace governance REST API"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "cleartrace-contracts",
  "cleartrace-db",
  "cleartrace-engine",
  "cleartrace-aia",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "cedarpy>=4.4",
  "python-multipart>=0.0.18",
  "uuid6>=2024.7",
]

[tool.uv.sources]
cleartrace-contracts = { workspace = true }
cleartrace-db = { workspace = true }
cleartrace-engine = { workspace = true }
cleartrace-aia = { workspace = true }

[project.scripts]
cleartrace-api = "cleartrace_core_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartrace_core_api"]
