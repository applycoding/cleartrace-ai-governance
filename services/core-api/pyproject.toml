[project]
name = "cleartrace-core-api"
version = "0.1.0"
description = "ClearTrace governance REST API"
requires-python = ">=3.12"
license = { text = "LicenseRef-ClearTrace-Evaluation-Only" }
dependencies = [
  "cleartrace-contracts",
  "cleartrace-db",
  "cleartrace-evidence",
  "cleartrace-audit",
  "cleartrace-engine",
  "cleartrace-aia",
  "cleartrace-register",
  "cleartrace-notifier",
  "cleartrace-reports",
  "cleartrace-connectors",
  "cleartrace-policy-watch",
  "cleartrace-risk",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "cedarpy>=4.4",
  "python-multipart>=0.0.18",
  "pydantic-settings>=2.6",
  "uuid6>=2024.7",
  "cryptography>=44.0",
  "jsonschema>=4.23",
  "psycopg[binary]>=3.2",
  "compliance-trestle>=3.0",
]

[tool.uv.sources]
cleartrace-contracts = { workspace = true }
cleartrace-db = { workspace = true }
cleartrace-evidence = { workspace = true }
cleartrace-audit = { workspace = true }
cleartrace-engine = { workspace = true }
cleartrace-aia = { workspace = true }
cleartrace-register = { workspace = true }
cleartrace-notifier = { workspace = true }
cleartrace-reports = { workspace = true }
cleartrace-connectors = { workspace = true }
cleartrace-policy-watch = { workspace = true }
cleartrace-risk = { workspace = true }

[project.scripts]
cleartrace-api = "cleartrace_core_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartrace_core_api"]
