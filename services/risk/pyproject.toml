[project]
name = "cleartrace-risk"
version = "0.1.0"
description = "ClearTrace metric registry, baselines, and monitoring engine"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "cel-python==0.5.0",
  "cleartrace-contracts",
  "evidently>=0.4.40",
  "fairlearn>=0.12",
  "numpy>=2.1",
  "pandas>=2.2",
  "presidio-analyzer>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "uuid6>=2024.7",
]

[tool.uv.sources]
cleartrace-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartrace_risk"]
