[project]
name = "cleartrace-policy-watch"
version = "0.1.0"
description = "ClearTrace policy change watcher and impact analysis"
requires-python = ">=3.12"
license = { text = "LicenseRef-ClearTrace-Evaluation-Only" }
dependencies = [
  "cleartrace-contracts",
  "cleartrace-db",
  "pydantic>=2.10",
  "uuid6>=2024.7",
]

[tool.uv.sources]
cleartrace-contracts = { workspace = true }
cleartrace-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartrace_policy_watch"]
