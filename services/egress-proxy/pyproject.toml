[project]
name = "cleartrace-egress-proxy"
version = "0.1.0"
description = "ClearTrace SSRF-safe egress proxy for connectors"
requires-python = ">=3.12"
license = { text = "LicenseRef-ClearTrace-Evaluation-Only" }
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartrace_egress_proxy"]
