[project]
name = "cleartrace-evidence"
version = "0.1.0"
description = "ClearTrace evidence store"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "cleartrace-contracts",
  "cleartrace-db",
  "uuid6>=2024.7",
]

[tool.uv.sources]
cleartrace-contracts = { workspace = true }
cleartrace-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartrace_evidence"]
