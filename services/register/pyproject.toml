[project]
name = "cleartrace-register"
version = "0.1.0"
description = "ClearTrace system register (15 governance categories)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "cleartrace-contracts",
  "fastapi>=0.115",
  "pydantic>=2.10",
  "uuid6>=2024.7",
  "pyyaml>=6.0",
]

[tool.uv.sources]
cleartrace-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartrace_register"]
