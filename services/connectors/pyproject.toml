[project]
name = "cleartrace-connectors"
version = "0.1.0"
description = "ClearTrace connector SDK and built-in connectors"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "cleartrace-contracts",
  "cleartrace-register",
  "cleartrace-egress-proxy",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "uuid6>=2024.7",
  "httpx>=0.28",
]

[tool.uv.sources]
cleartrace-contracts = { workspace = true }
cleartrace-register = { workspace = true }
cleartrace-egress-proxy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartrace_connectors"]
