[project]
name = "cleartrace-audit"
version = "0.1.0"
description = "ClearTrace audit ledger"
requires-python = ">=3.12"
license = { text = "LicenseRef-ClearTrace-Evaluation-Only" }
dependencies = [
  "cleartrace-contracts",
  "cleartrace-db",
  "uuid6>=2024.7",
  "cryptography>=44.0",
]

[project.scripts]
cleartrace-audit-verify = "cleartrace_audit.cli:main"

[tool.uv.sources]
cleartrace-contracts = { workspace = true }
cleartrace-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartrace_audit"]
