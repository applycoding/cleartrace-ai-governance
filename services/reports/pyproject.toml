[project]
name = "cleartrace-reports"
version = "0.1.0"
description = "ClearTrace EN/FR report builders (HTML, PDF, CSV)"
requires-python = ">=3.12"
license = { text = "LicenseRef-ClearTrace-Evaluation-Only" }
dependencies = [
  "cleartrace-contracts",
  "jinja2>=3.1",
  "xhtml2pdf>=0.2.16",
  "uuid6>=2024.7",
]

[tool.uv.sources]
cleartrace-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartrace_reports"]
