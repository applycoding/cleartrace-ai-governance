name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      CLEARTRACE_CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-packages --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy packages/cleartrace-contracts/src services/core-api/src db/src

      - name: Bandit
        run: uv run bandit -r packages services/core-api db -q

      - name: Licence gate
        run: uv run python tools/licence_gate.py

      - name: Secrets scan
        run: uv run python tools/secrets_scan.py

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Verify SBOM artifact
        run: test -s sbom.cyclonedx.json

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Unit tests
        run: uv run pytest -q tests services --ignore=tests/integration -m "not integration"

      - name: Integration stack (Docker Compose)
        run: bash scripts/ci_compose_stack.sh

      - name: Integration and TRL 5 tests
        env:
          CLEARTRACE_DATABASE_URL: postgresql+psycopg://cleartrace_super:cleartrace_super@127.0.0.1:5432/cleartrace
          CLEARTRACE_MIGRATOR_DSN: postgresql://cleartrace_super:cleartrace_super@127.0.0.1:5432/cleartrace
          CLEARTRACE_TEST_DSN: postgresql://cleartrace_app:cleartrace_app@127.0.0.1:6432/cleartrace
          CLEARTRACE_NOTIFIER_DSN: postgresql://cleartrace_app:cleartrace_app@127.0.0.1:6432/cleartrace
          CLEARTRACE_NATS_URL: nats://127.0.0.1:4222
          CLEARTRACE_CI: "1"
        run: uv run pytest -q tests/integration tests/trl5 services

  web-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: web
        run: npm ci || npm install
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
