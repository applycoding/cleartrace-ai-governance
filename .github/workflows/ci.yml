name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      CLEARTRACE_CI: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OPA (pinned v1.4.2, SHA-256 checked)
        run: |
          bash scripts/install_opa.sh
          echo "/tmp/opa-install" >> "$GITHUB_PATH"
          echo "OPA_BIN=/tmp/opa-install/opa" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: uv sync --all-packages --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: >-
          uv run mypy packages/cleartrace-contracts/src services/core-api/src
          services/engine/src services/aia/src services/evidence/src services/audit/src
          services/notifier/src services/reports/src services/register/src
          services/connectors/src services/egress-proxy/src services/policy-watch/src services/risk/src db/src

      - name: Bandit
        run: uv run bandit -r packages services db -q

      - name: Licence gate
        run: uv run python tools/licence_gate.py

      - name: Secrets scan
        run: uv run python tools/secrets_scan.py

      - name: Prepare artifact folders
        run: mkdir -p artifacts/t26

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Verify SBOM artifact
        run: test -s sbom.cyclonedx.json

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy full report for the T-26 gate (all severities, JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: artifacts/t26/trivy.json
          exit-code: "0"
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Unit tests
        run: >-
          mkdir -p artifacts &&
          uv run pytest -q tests services --ignore=tests/integration -m "not integration"
          --junitxml=artifacts/junit-unit.xml

      - name: Install Postgres 16 client tools (match the Compose server for T-05)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-16
          /usr/lib/postgresql/16/bin/pg_dump --version

      - name: Integration stack (Docker Compose)
        run: bash scripts/ci_compose_stack.sh

      - name: Image SBOM (Syft, shipped containers)
        run: bash scripts/ci_image_sbom.sh

      - name: Full inventory SBOM merge
        run: uv run python tools/sbom_builder.py

      - name: Licence gate (sources and merged SBOM)
        run: uv run python tools/licence_gate.py

      - name: Integration and TRL 5 tests
        env:
          CLEARTRACE_DATABASE_URL: postgresql+psycopg://cleartrace_super:cleartrace_super@127.0.0.1:5432/cleartrace
          CLEARTRACE_MIGRATOR_DSN: postgresql://cleartrace_super:cleartrace_super@127.0.0.1:5432/cleartrace
          CLEARTRACE_TEST_DSN: postgresql://cleartrace_app:cleartrace_app@127.0.0.1:6432/cleartrace
          CLEARTRACE_NOTIFIER_DSN: postgresql://cleartrace_app:cleartrace_app@127.0.0.1:6432/cleartrace
          CLEARTRACE_NATS_URL: nats://127.0.0.1:4222
          CLEARTRACE_T05_RESTORE_ADMIN_DSN: postgresql://cleartrace_super:cleartrace_super@127.0.0.1:5435/postgres
          PG_BIN: /usr/lib/postgresql/16/bin
          CLEARTRACE_CI: "1"
        run: >-
          mkdir -p artifacts &&
          uv run pytest -q tests/integration tests/trl5 services
          --junitxml=artifacts/junit-integration.xml

      - name: T-26 security suite (Semgrep, ZAP, Schemathesis)
        env:
          CLEARTRACE_DATABASE_URL: postgresql+psycopg://cleartrace_app:cleartrace_app@127.0.0.1:6432/cleartrace
          CLEARTRACE_DEV_SKIP_AUTH: "true"
          CLEARTRACE_DEV_AUTH_TOKEN: t26-security-suite-token
          CLEARTRACE_CI: "1"
        run: bash scripts/ci_security_suite.sh

      - name: TRL 5 report
        if: always()
        run: >-
          uv run python tools/trl5_report.py --junit-unit artifacts/junit-unit.xml
          --junit-integration artifacts/junit-integration.xml
          --t26-summary artifacts/t26/t26_summary.json

      - name: Upload T-26 security outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t26-security-outputs
          path: artifacts/t26/
          if-no-files-found: error

      - name: Upload TRL 5 report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trl5-test-report
          path: |
            docs/trl5/TRL5_TEST_REPORT.md
            artifacts/junit-unit.xml
            artifacts/junit-integration.xml

  web-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: web
        run: npm ci || npm install
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
