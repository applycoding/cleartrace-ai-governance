[project]
name = "cleartrace-contracts"
version = "0.1.0"
description = "Shared Pydantic models and service protocols for ClearTrace"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartrace_contracts"]
