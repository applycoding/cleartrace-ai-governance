# Optional TLS overlay for local Compose. It encrypts only the PgBouncer to Postgres
# hop; API to PgBouncer, NATS and OPA stay plaintext, so ASVS V1.9.1 and V9.2.2 remain Fail.
#
# Usage:
#   ./deploy/compose/tls/generate-certs.sh
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.tls.yml up
#
# Postgres listens with TLS; PgBouncer connects to it with sslmode=require.

services:
  postgres:
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
    volumes:
      - ./tls:/var/lib/postgresql/tls:ro

  pgbouncer:
    environment:
      DATABASE_URL: postgres://cleartrace_app:cleartrace_app@postgres:5432/cleartrace?sslmode=require
