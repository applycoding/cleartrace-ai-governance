apiVersion: v1
kind: Service
metadata:
  name: {{ include "cleartrace.fullname" . }}
  labels:
    {{- include "cleartrace.labels" . | nindent 4 }}
spec:
  type: {{ .Values.cleartrace.service.type }}
  ports:
    - port: {{ .Values.cleartrace.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cleartrace.selectorLabels" . | nindent 4 }}
